aid: uplevelteam
name: Uplevel
description: >-
  Uplevel is an engineering intelligence platform for enterprises — an
  operating system for engineering transformation that helps leaders see team
  performance clearly, solve root causes, and sustain improvement in the AI
  era. The platform pulls data from existing tools and uses machine learning to
  produce engineering metrics and actionable insights: DORA metrics, time
  allocation and ML issue classification, deep-work and interruption
  measurement, developer-experience metrics, and AI-impact analysis, framed by
  the company's WAVE framework of engineering KPIs. Founded in 2018 and led by
  CEO Joe Levy, Uplevel is backed by Norwest Venture Partners, Madrona
  Ventures, and Voyager Capital. Uplevel serves enterprise customers such as
  Xactly, Accolade, Braze, Avalara, and Qualtrics; it operates an internal API
  behind the product (api.uplevelteam.com, AWS API Gateway) but publishes no
  public developer API surface.
